name: OTTCLUB Key Update

on:
  # Запуск по расписанию (например, каждые 2 дня, так как подписка на 3 дня)
  schedule:
    - cron: '0 0 */2 * *'
  # Возможность ручного запуска
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install selenium undetected-chromedriver requests beautifulsoup4

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Run OTTCLUB Automation
        run: python ott_automation.py
        env:
          # Если в скрипте используются секреты, добавь их сюда
          PYTHONUNBUFFERED: 1

